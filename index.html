<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajat AI - Free AI Assistant</title>
<meta name="description" content="Rajat AI is a free AI assistant to ask anything.">
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI}
body{background:#212121;color:#ececec;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;text-align:center;background:#171717;font-weight:800;font-size:18px;border-bottom:1px solid #333;position:sticky;top:0}
.header span{color:#10a37f}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{padding:14px 18px;border-radius:16px;max-width:92%;line-height:1.7;font-size:15px;word-wrap:break-word}
.user{background:#2f2f2f;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#444654;align-self:flex-start;border-bottom-left-radius:4px}
#box{display:flex;padding:12px 15px;background:#171717;gap:10px;align-items:center;position:sticky;bottom:0}
input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #555;background:#2f2f2f;color:#fff;outline:none;font-size:15px}
button{padding:13px 22px;border-radius:25px;border:none;background:#10a37f;color:#fff;font-weight:700;cursor:pointer}
.footer{text-align:center;font-size:11px;color:#666;padding:5px;background:#171717}
b{color:#fff}
</style>
</head>
<body>
<div class="header">🤖 <span>Rajat</span> AI</div>
<div id="chat">
<div class="msg bot">Hello! I'm <b>Rajat AI</b>. Kuch bhi pucho - Padhai, Coding, Job help, Story. Hindi / English dono me jawab dunga.</div>
</div>
<div id="box">
<input id="q" placeholder="Message Rajat AI..." autocomplete="off">
<button onclick="ask()">Send</button>
</div>
<div class="footer">Rajat AI can make mistakes. Please verify important info.</div>

<script>
const input = document.getElementById('q');
input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') ask(); });

async function ask(){
  let question = input.value.trim();
  if(!question) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${question}</div>`;
  input.value = "";
  let id = "a"+Date.now();
  chat.innerHTML += `<div class="msg bot" id="${id}">Thinking...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try{
    let res = await puter.ai.chat(question);
    // **bold** ko <b> me badlo aur line break thik karo
    let formatted = res
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/\n/g, '<br>');
    document.getElementById(id).innerHTML = formatted;
  }catch(e){
    document.getElementById(id).innerText = "Server busy hai, 5 sec baad try karo.";
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
