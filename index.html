<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajat AI - Free ChatGPT</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#212121;color:white;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;text-align:center;background:#171717;font-weight:bold;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{padding:12px 15px;border-radius:10px;margin:10px 0;max-width:90%;line-height:1.5;word-wrap:break-word}
.user{background:#2f2f2f;margin-left:auto}
.bot{background:#444654}
#box{display:flex;padding:10px;background:#171717;gap:8px}
input{flex:1;padding:14px;border-radius:25px;border:none;outline:none;background:#40414f;color:white}
button{padding:12px 20px;border-radius:25px;border:none;background:#10a37f;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">🤖 Rajat AI - ChatGPT Clone (Working)</div>
<div id="chat">
<div class="msg bot">Hi Rajat! Bolo kya help chahiye? Nepal news, Google search, kuch bhi pucho.</div>
</div>
<div id="box">
<input id="q" placeholder="Yaha likho...">
<button onclick="ask()">Send</button>
</div>

<script>
async function ask(){
  let input = document.getElementById('q');
  let question = input.value.trim();
  if(!question) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${question}</div>`;
  input.value = "";
  let tempId = "t"+Date.now();
  chat.innerHTML += `<div class="msg bot" id="${tempId}">Typing...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try{
    let response = await puter.ai.chat(question);
    document.getElementById(tempId).innerText = response;
  } catch(e){
    document.getElementById(tempId).innerText = "Error: "+e.message+" - Dobara try karo";
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
