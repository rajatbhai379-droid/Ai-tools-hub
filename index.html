<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajat AI - Free AI Assistant</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#212121;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;text-align:center;background:#171717;font-weight:bold;border-bottom:1px solid #333}
.header b{color:#10a37f}
#chat{flex:1;overflow-y:auto;padding:20px}
.msg{padding:12px 16px;border-radius:12px;margin:10px 0;max-width:90%;line-height:1.6;white-space:pre-wrap}
.user{background:#2f2f2f;margin-left:auto}
.bot{background:#444654}
#box{display:flex;padding:12px;background:#171717;gap:8px}
input{flex:1;padding:14px;border-radius:25px;border:none;background:#40414f;color:#fff;outline:none}
button{padding:12px 20px;border-radius:25px;border:none;background:#10a37f;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="header">🤖 <b>Rajat</b> AI</div>
<div id="chat"><div class="msg bot">Hi! I'm Rajat AI. Kuch bhi pucho.</div></div>
<div id="box"><input id="q" placeholder="Message Rajat AI..."><button onclick="ask()">Send</button></div>
<script>
async function ask(){
let q=document.getElementById('q').value.trim();
if(!q)return;
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user">${q}</div>`;
document.getElementById('q').value="";
let id=Date.now();
chat.innerHTML+=`<div class="msg bot" id="${id}">Thinking...</div>`;
chat.scrollTop=chat.scrollHeight;
try{
let r=await puter.ai.chat(q);
document.getElementById(id).innerText=r;
}catch(e){
document.getElementById(id).innerText="Try again";
}
chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
