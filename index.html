<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajat AI - Free AI Assistant to Ask Anything</title>
<meta name="description" content="Rajat AI is a free AI assistant like ChatGPT. Ask anything, get instant answers, write content, solve questions.">
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial}
body{background:#212121;color:#ececec;display:flex;flex-direction:column;height:100vh}
.header{background:#171717;padding:16px;text-align:center;font-weight:700;font-size:18px;border-bottom:1px solid #333;letter-spacing:0.5px}
.header span{color:#10a37f}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:14px 18px;border-radius:16px;max-width:88%;line-height:1.6;white-space:pre-wrap;font-size:15px}
.user{background:#2f2f2f;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#444654;align-self:flex-start;border-bottom-left-radius:4px}
#box{display:flex;padding:12px 15px;background:#171717;gap:10px;align-items:center}
input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #555;outline:none;background:#2f2f2f;color:white;font-size:15px}
button{padding:12px 22px;border-radius:25px;border:none;background:#10a37f;color:white;font-weight:700;cursor:pointer;font-size:15px}
button:hover{background:#0d8a6a}
.footer{text-align:center;font-size:11px;color:#777;padding:6px;background:#171717}
</style>
</head>
<body>
<div class="header">🤖 <span>Rajat</span> AI</div>
<div id="chat">
<div class="msg bot">Hello! I'm Rajat AI. 👋
Kuch bhi pucho - Padhai, Coding, Story, Job help ya Google search jaisa koi bhi sawal. Hindi / English dono me jawab dunga.</div>
</div>
<div id="box">
<input id="q" placeholder="Message Rajat AI..." onkeypress="if(event.key==='Enter')ask()">
<button onclick="ask()">Send</button>
</div>
<div class="footer">Rajat AI can make mistakes. Please verify important info.</div>

<script>
async function ask(){
  let input=document.getElementById('q');
  let question=input.value.trim();
  if(!question) return;
  let chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="msg user">${question}</div>`;
  input.value="";
  let id="t"+Date.now();
  chat.innerHTML+=`<div class="msg bot" id="${id}">Rajat AI is thinking...</div>`;
  chat.scrollTop=chat.scrollHeight;
  try{
    let res=await puter.ai.chat(question, {model: "claude-3-5-sonnet"});
    // agar claude fail ho to gpt use karo
    if(!res) res=await puter.ai.chat(question);
    document.getElementById(id).innerText=res;
  }catch(e){
    try{
      let res2=await puter.ai.chat(question);
      document.getElementById(id).innerText=res2;
    }catch(err){
      document.getElementById(id).innerText="Server busy hai bhai, 5 sec baad dobara try karo.";
    }
  }
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
