<style>
*{box-sizing:border-box}body{font-family:'Outfit',sans-serif;margin:0;background:#0a0a0f;color:#e2e8f0}
header{background:rgba(15,23,42,0.8);backdrop-filter:blur(10px);padding:18px;text-align:center;position:sticky;top:0;border-bottom:1px solid #1e293b;z-index:10}
header h2{margin:0;font-size:26px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{margin:4px 0 0;color:#94a3b8;font-size:13px;letter-spacing:1px}
.container{max-width:950px;margin:auto;padding:24px}
.hero{text-align:center;padding:30px 20px}
.hero h1{font-size:34px;margin:0;background:linear-gradient(90deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#94a3b8;margin-top:10px}
.card{background:linear-gradient(145deg,#111827,#1e293b);padding:22px;border-radius:18px;border:1px solid #334155;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.card h3{margin-top:0;color:#f8fafc}
input,textarea{width:100%;padding:14px;margin:10px 0;background:#0f172a;border:1px solid #334155;border-radius:12px;color:#fff;font-size:14px}
input::placeholder,textarea::placeholder{color:#64748b}
.btn{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;padding:13px;border:none;border-radius:12px;cursor:pointer;width:100%;font-weight:700;letter-spacing:0.5px;transition:0.2s}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn:hover:not(:disabled){transform:scale(1.02);opacity:0.9}
.result{background:#0f172a;padding:14px;border-radius:12px;margin-top:12px;white-space:pre-wrap;line-height:1.7;font-size:14px;border:1px solid #1e293b;min-height:40px;color:#cbd5e1}
#chatBox{height:340px;overflow-y:auto;border:1px solid #1e293b;padding:14px;border-radius:12px;background:#0f172a}
#chatBox p{margin:12px 0;line-height:1.6;font-size:14px}
#chatBox b{color:#60a5fa}
footer{text-align:center;padding:24px;background:#020617;color:#64748b;margin-top:30px;border-top:1px solid #1e293b}
footer a{color:#94a3b8;margin:0 10px;text-decoration:none}footer a:hover{color:#fff}
img.gen{width:100%;border-radius:14px;margin-top:12px;border:1px solid #334155;max-height:600px;object-fit:contain;background:#000}
.small-btns{display:flex;gap:10px;margin-top:10px}
.small-btns button{flex:1;padding:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;cursor:pointer;font-weight:600}
</style>
</head>
