<!DOCTYPE html><html><head><title>Essay Generator</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:Arial;max-width:600px;margin:auto;padding:20px}textarea,input{width:100%;padding:10px;margin:10px 0}button{padding:10px 20px;background:#000;color:#fff;border:none;border-radius:5px}</style></head><body><h2>Essay Generator</h2><input id="topic" placeholder="Topic likho jaise Diwali"><button onclick="gen()">Generate</button><p id="out"></p><script>function gen(){let t=document.getElementById('topic').value; document.getElementById('out').innerText="Yeh raha '"+t+"' par essay ka structure:\n\n1. Introduction: "+t+" ek bahut mahatvapurn vishay hai...\n2. Body: Iske fayde, nuksan aur mahatva...\n3. Conclusion: Ant me hum keh sakte hai ki "+t+" hamare jeevan me bahut zaruri hai.\n\n(Is text ko aap copy karke use kar sakte ho, ye demo hai, full AI chat me kaam karega)"}</script><br><a href="index.html">Back</a></body></html>
